name: Snowflake CI/CD

on:
  pull_request:
    types: [closed]
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event.pull_request.merged == true)
    runs-on: ubuntu-22.04

    steps:
      # Step 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Create Snowflake private key file
      - name: Create Snowflake private key file
        run: |
          echo "${{ secrets.SNOW_PRIVATE_KEY }}" > /tmp/snowflake_key.p8
          chmod 600 /tmp/snowflake_key.p8

      # Step 3: Select target database
      - name: Select target database
        id: dbmap
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "db=DB_BILL_CLASSIFICATION_PRD" >> "$GITHUB_OUTPUT"
          else
            echo "db=DB_BILL_CLASSIFICATION_DEV" >> "$GITHUB_OUTPUT"
          fi

      # Step 4: Add pipx bin to PATH
      - name: Add pipx bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Step 5: Install Snowflake CLI
      - name: Install Snowflake CLI
        uses: Snowflake-Labs/snowflake-cli-action@v1.5
        with:
          cli-version: latest
          default-config-file-path: .snowflake/config.toml

      # Step 6: Set config.toml permissions
      - name: Set config.toml permissions
        run: chmod 600 .snowflake/config.toml

      # Step 7: Fetch latest from Snowflake Git Repository object
      - name: Fetch latest from Snowflake Git repository
        run: |
          snow git fetch DB_BILL_CLASSIFICATION_DEV.BILLS_PROSPECT.MY_REPO -c deploy

      # Step 8: Ensure BILLS_PROSPECT schema exists
      - name: Ensure BILLS_PROSPECT schema exists
        env:
          TARGET_DB: ${{ steps.dbmap.outputs.db }}
        run: |
          snow sql -c deploy -q "CREATE SCHEMA IF NOT EXISTS ${TARGET_DB}.BILLS_PROSPECT;" --database "${TARGET_DB}"

      # Step 9: Execute all SQL files from Snowflake Git repository path
      - name: Execute all SQL files from repository
        env:
          TARGET_DB: ${{ steps.dbmap.outputs.db }}
        shell: bash
        run: |
          set -e
          BRANCH="${{ github.ref_name }}"
          SIMPLE_BRANCH="${BRANCH##*/}"

          REPO_ROOT="@DB_BILL_CLASSIFICATION_DEV.BILLS_PROSPECT.MY_REPO/branches/${SIMPLE_BRANCH}"

          echo "🚀 Executing all .sql files from ${REPO_ROOT}/sql/**/*.sql ..."

          if ! snow git execute "${REPO_ROOT}/sql/**/*.sql" \
            --database "${TARGET_DB}" \
            --schema "BILLS_PROSPECT" \
            --on-error break \
            -c deploy; then
            echo "❌ Deployment failed while executing SQL scripts."
            exit 1
          fi

          echo "✅ Successfully executed all SQL scripts."

      # Step 10: Build Snowpark Procedures
      - name: Build Snowpark procedures
        run: |
          SNOWPARK_PROJECT_PATH="Snowpark"
          if [ -f "${SNOWPARK_PROJECT_PATH}/snowflake.yml" ]; then
            echo "📦 Building Snowpark project from '${SNOWPARK_PROJECT_PATH}'..."
            snow snowpark build --project "${SNOWPARK_PROJECT_PATH}" -c deploy
          else
            echo "✅ No Snowpark project found at '${SNOWPARK_PROJECT_PATH}', skipping build."
          fi

      # Step 11: Deploy Snowpark Procedures
      - name: Deploy Snowpark procedures to target DB
        env:
          TARGET_DB: ${{ steps.dbmap.outputs.db }}
        run: |
          SNOWPARK_PROJECT_PATH="Snowpark"
          if [ -f "${SNOWPARK_PROJECT_PATH}/snowflake.yml" ]; then
            echo "🚀 Deploying Snowpark project from '${SNOWPARK_PROJECT_PATH}' to ${TARGET_DB}..."
            snow snowpark deploy --project "${SNOWPARK_PROJECT_PATH}" --prune --replace \
              --database "${TARGET_DB}" \
              --schema "BILLS_PROSPECT" \
              -c deploy
          else
            echo "✅ No Snowpark project found at '${SNOWPARK_PROJECT_PATH}', skipping deploy."
          fi

      # Step 12: Deploy Streamlit App
      - name: Deploy Streamlit app to target DB
        env:
          TARGET_DB: ${{ steps.dbmap.outputs.db }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          STREAMLIT_PROJECT_PATH="Streamlit"
          if [ -f "${STREAMLIT_PROJECT_PATH}/snowflake.yml" ]; then
            echo "🚀 Deploying Streamlit project from '${STREAMLIT_PROJECT_PATH}' to ${TARGET_DB}..."

            if [[ "$TARGET_BRANCH" == "main" ]]; then
              TARGET_ENTITY_ID="minol_streamlit_prod"
            else
              TARGET_ENTITY_ID="minol_streamlit_dev"
            fi

            snow streamlit deploy "${TARGET_ENTITY_ID}" \
              --project "${STREAMLIT_PROJECT_PATH}" \
              --replace \
              --database "${TARGET_DB}" \
              --schema "BILLS_PROSPECT" \
              -c deploy
          else
            echo "✅ No Streamlit project found at '${STREAMLIT_PROJECT_PATH}', skipping deploy."
          fi
